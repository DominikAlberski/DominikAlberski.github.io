{% if article.collection == "posts" %}
<div class="article-card article-card-own">
  <header class="article-header">
    <span class="badge">My post</span>
    <div class="article-title">
      <a href="{{ article.url }}">
        <h2>
          {{ article.title }}
        </h2>
      </a>
    </div>
    <div class="article-autor-name">
      <h3>
        {{ site.author }}
      </h3>
    </div>
  </header>
  <div class="article-body">
    <p>{{ article.description }}</p>
  </div>
</div>
{% else %}
<div class="article-card">
  <header class="article-header">
    <div class="article-title">
      <a href="{{ article.link }}" target="_blank" rel="noopener noreferrer">
        <h2>
          {{ article.title }}
        </h2>
      </a>
    </div>
    <div class="article-autor-name">
      <h3>
        {{ article.author }}
      </h3>
    </div>
  </header>
  <div class="article-body">
    {{ article.content }}
  </div>
</div>
{% endif %}
